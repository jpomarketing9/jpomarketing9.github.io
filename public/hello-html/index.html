<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello HTML</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f2f2f2; --muted: #a8a8a8; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Hello HTML</h1>
    <p>Denne side er udgivet fra JPO Marketings GitHub Pages.</p>
  </main>
</body>
</html>
